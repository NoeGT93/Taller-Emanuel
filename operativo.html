</style></head>
<body>
<section id="gate"><h1>TALLER EMANUEL</h1><p>Acceso seguro al sistema de repuestos</p>
<div id="configuration"><p class="muted">Conecta Supabase con la URL y la clave pública, nunca una clave privada.</p><form id="configForm"><label>URL de Supabase<input name="url" type="url" required placeholder="https://xxxx.supabase.co"></label><label>Clave pública<input name="key" required autocomplete="off"></label><button>Conectar</button></form></div>
<form id="signin" class="hidden"><label>Correo<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Iniciar sesión</button><button type="button" class="light" id="resetConfig">Cambiar conexión</button></form>
</section>
<section id="application" class="hidden">
<aside class="sidebar"><div class="brand"><div class="brand-mark">TE</div><div><strong>TALLER EMANUEL</strong><span>REPUESTOS · POS</span></div></div><nav id="nav" class="nav"></nav><div class="sidebar-footer"><div class="user-mini"><div class="avatar">TE</div><div style="flex:1;min-width:0"><strong id="identity">Administrador</strong><span>Sesión activa</span></div><button id="signout" title="Cerrar sesión">Salir</button></div></div></aside>
<div class="main"><header class="topbar"><div class="top-title"><span class="eyebrow">Taller Emanuel · Centro de repuestos</span><h1 id="viewheading">Resumen del negocio</h1></div><div class="top-actions"><span class="cash-status"><span class="status-dot"></span> Sistema conectado</span><button class="avatar top-avatar" title="Usuario activo">TE</button></div></header><main id="content" class="content"></main></div>
<nav id="mobileNav" class="mobile-nav"></nav></section>
<div id="overlay"></div><div id="message" style="display:none"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),Q=n=>'Q '+Number(n||0).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});
let api,user,role,products=[],customers=[],sales=[],cash,cart=[],section='Inicio',off=0;
const conf='te-pos-public-config';const screens=['Inicio','Vender','Inventario','Clientes','Caja','Gastos','Compras','Usuarios','Reportes'];
function msg(s){$('message').textContent=s;$('message').style.display='block';setTimeout(()=>$('message').style.display='none',5000)}
function connect(){const c=JSON.parse(localStorage.getItem(conf)||'null');if(c&&window.supabase){api=window.supabase.createClient(c.url,c.key);$('configuration').classList.add('hidden');$('signin').classList.remove('hidden');return true}return false}
$('configForm').onsubmit=e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target)),u=new URL(f.url);if(!u.hostname.endsWith('.supabase.co')||u.protocol!=='https:')throw Error('URL de Supabase inválida');localStorage.setItem(conf,JSON.stringify({url:u.origin,key:f.key.trim()}));connect()}catch(x){msg(x.message)}};
$('resetConfig').onclick=()=>{localStorage.removeItem(conf);location.reload()};
$('signin').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));try{const r=await api.auth.signInWithPassword({email:f.email,password:f.password});if(r.error)throw r.error;await start()}catch(x){msg(x.message)}};
$('signout').onclick=async()=>{await api.auth.signOut();location.reload()};
async function run(q){const r=await q;if(r.error)throw r.error;return r.data}
async function start(){const {data:{user:u}}=await api.auth.getUser();if(!u)return;user=u;role=await run(api.from('profiles').select('*').eq('id',u.id).single());if(!role.active)throw Error('Cuenta desactivada');$('identity').textContent=role.name+' · '+(role.role==='admin'?'Administrador':'Vendedor');$('gate').classList.add('hidden');$('application').classList.remove('hidden');await load();goto('Inicio')}
async function load(){products=await run(api.from('products').select('*').eq('active',true).order('name'));customers=await run(api.from('customers').select('*').order('name'));sales=await run(api.from('sales').select('*').order('created_at',{ascending:false}).limit(250));cash=await run(api.from('cash_sessions').select('*').eq('cashier_id',user.id).is('closed_at',null).maybeSingle())}
function goto(s){document.getElementById('viewheading').textContent=({'Inicio':'Resumen del negocio','Vender':'Nueva venta','Inventario':'Inventario','Clientes':'Clientes y crédito','Caja':'Control de caja','Gastos':'Gastos','Compras':'Compras y proveedores','Usuarios':'Usuarios y permisos','Reportes':'Reportes'})[s]||s;if(role.role!=='admin'&&['Compras','Usuarios','Reportes'].includes(s))return msg('Solo administradores');section=s;$('nav').innerHTML=screens.filter(x=>role.role==='admin'||!['Compras','Usuarios','Reportes'].includes(x)).map(x=>'<button class="'+(s===x?'on':'')+'" data-screen="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>goto(b.dataset.screen));document.getElementById('mobileNav').innerHTML=document.getElementById('nav').innerHTML;document.getElementById('mobileNav').querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>goto(b.dataset.screen));paint()}
const button=(name,act,cl='')=>'<button class="'+cl+'" data-action="'+act+'">'+name+'</button>';
const table=(heads,rows)=>'<div class="card scroll"><table><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
function paint(){let h='';if(section==='Inicio'){const now=sales.filter(s=>new Date(s.created_at).toDateString()===new Date().toDateString());h='<div class="grid">'+[['Ventas hoy',Q(now.reduce((a,s)=>a+Number(s.total),0))],['Tickets',now.length],['Repuestos',products.length],['Stock bajo',products.filter(p=>p.stock<=p.min).length]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><h1>'+x[1]+'</h1></div>').join('')+'</div><h2>Movimientos recientes</h2>'+table(['#','Fecha','Forma de pago','Total'],sales.slice(0,12).map(s=>[s.id,new Date(s.created_at).toLocaleString('es-GT'),esc(s.method),Q(s.total)]))}
if(section==='Vender'){const total=cart.reduce((n,i)=>n+Number(products.find(p=>p.id===i.id)?.price||0)*i.qty,0);h='<div class="sale"><div><div class="card"><input id="find" placeholder="Buscar o escanear código de barras / QR"><select id="vehicle"><option value="">Todos</option><option value="tuctuc">Tuc tuc</option><option value="moto">Moto</option><option value="auto">Vehículos</option></select></div><div class="grid" id="catalog"></div></div><div class="card"><h2>Ticket de venta</h2><p class="muted">'+(cash?'Caja abierta':'Caja cerrada')+'</p>'+cart.map(i=>{const p=products.find(x=>x.id===i.id);return '<div class="line"><div>'+esc(p?.name)+'<br>'+Q(p?.price)+'</div><div>'+button('−','minus:'+i.id,'light')+' '+i.qty+' '+button('+','plus:'+i.id,'light')+'</div></div>'}).join('')+'<div class="line">Descuento '+button(Q(off),'discount','light')+'</div><div class="total">'+Q(Math.max(0,total-off))+'</div>'+button('Cobrar','sale','mint')+'</div></div>'}
if(section==='Inventario')h='<h2>Inventario '+(role.role==='admin'?button('+ Nuevo producto','product'):'')+'</h2>'+table(['Código','Producto','Vehículo','Precio','Stock','Acción'],products.map(p=>[esc(p.code),esc(p.name),esc(p.compat),Q(p.price),p.stock,role.role==='admin'?button('Editar','edit:'+p.id,'light'):'—']));
if(section==='Clientes')h='<h2>Clientes '+button('+ Nuevo cliente','customer')+'</h2>'+table(['Nombre','Tipo','Teléfono','Crédito disponible'],customers.map(c=>[esc(c.name),esc(c.type),esc(c.phone),Q(c.credit_limit-c.balance)]));
if(section==='Caja')h='<div class="card"><h2>Caja '+(cash?'abierta':'cerrada')+'</h2><p>Fondo: '+Q(cash?.opening)+'</p>'+(cash?button('Movimiento','movement')+' '+button('Cerrar caja','close'):button('Abrir caja','open'))+'</div>';
if(section==='Gastos'){h='<h2>Gastos '+button('+ Nuevo gasto','expense')+'</h2><div id="asyncList"></div>';populate('expenses')}
if(section==='Compras'){h='<h2>Entradas de mercadería '+button('+ Registrar compra','purchase')+'</h2><div id="asyncList"></div>';populate('purchases')}
if(section==='Usuarios'){h='<div class="card"><h2>Empleados y permisos</h2><p class="muted">Crea empleados mediante Supabase → Authentication → Users → Invite user. Después administra sus roles aquí.</p><div id="asyncList"></div></div>';populate('profiles')}
if(section==='Reportes')h='<h2>Ventas '+button('Exportar CSV','export')+'</h2>'+table(['#','Fecha','Pago','Total'],sales.map(s=>[s.id,new Date(s.created_at).toLocaleString('es-GT'),esc(s.method),Q(s.total)]));
$('content').innerHTML=h;attach();if(section==='Vender')catalog()}
function attach(){$('content').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));const f=$('find');if(f){f.oninput=catalog;f.onkeydown=e=>{if(e.key==='Enter'){const p=products.find(x=>x.code===f.value.trim());if(p){increment(p.id,1);f.value=''}else msg('Código no registrado')}};$('vehicle').onchange=catalog}}
function catalog(){const f=$('find');if(!f)return;const t=f.value.toLowerCase(),v=$('vehicle').value;$('catalog').innerHTML=products.filter(p=>(!v||p.type===v)&&[p.code,p.name,p.compat].join(' ').toLowerCase().includes(t)).map(p=>'<div class="product"><span class="muted">'+esc(p.type)+' · '+p.stock+' disponibles</span><strong>'+esc(p.name)+'</strong><p class="muted">'+esc(p.compat)+'</p><span>'+Q(p.price)+'</span>'+button('+','add:'+p.id,'mint')+'</div>').join('');$('catalog').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action))}
function increment(id,n){const p=products.find(x=>x.id===id),i=cart.find(x=>x.id===id);if(!p||n>0&&(i?.qty||0)>=p.stock)return msg('Existencias insuficientes');if(i)i.qty+=n;else if(n>0)cart.push({id,qty:1});cart=cart.filter(i=>i.qty>0);paint()}
function form(title,fields,submit){$('overlay').innerHTML='<div class="modalback"><form id="modalForm" class="modal"><h2>'+esc(title)+'</h2>'+fields+'<div class="actions"><button type="button" id="dismiss" class="light">Cancelar</button><button>Guardar</button></div></form></div>';$('dismiss').onclick=()=>$('overlay').innerHTML='';$('modalForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('button:not([type])');btn.disabled=true;try{await submit(Object.fromEntries(new FormData(e.target)));$('overlay').innerHTML='';await load();paint();msg('Guardado correctamente')}catch(err){msg(err.message)}finally{btn.disabled=false}}}
const field=(t,n,val='',type='text',extra='')=>'<label>'+esc(t)+'<input name="'+n+'" type="'+type+'" value="'+esc(val)+'" '+extra+' required></label>';
const amount=(t,n,v=0)=>field(t,n,v,'number','min="0" step="0.01"');

async function action(a){try{if(a.startsWith('add:')||a.startsWith('plus:')||a.startsWith('minus:'))return increment(Number(a.split(':')[1]),a.startsWith('minus:')?-1:1);
